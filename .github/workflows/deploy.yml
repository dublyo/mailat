name: Build and Push Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/dublyo/mailat-api
  WEB_IMAGE: ghcr.io/dublyo/mailat-web

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: mailat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAILAT_TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/mailat_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Test API
        working-directory: apps/api
        run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Test and build web
        working-directory: apps/web
        run: |
          npm ci
          npm test
          npm run build
      - name: Test Go SDK
        working-directory: packages/sdk-go
        run: go test -race ./...
      - name: Test JavaScript SDK
        working-directory: packages/sdk-js
        run: |
          npm ci
          npm run typecheck
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Python SDK
        working-directory: packages/sdk-python
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: echo "VERSION=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Build and push API image
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: VERSION=${{ github.sha }}
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Web image using standard docker
      - name: Build Web image
        run: |
          cd apps/web
          docker build -t ${{ env.WEB_IMAGE }}:latest -t ${{ env.WEB_IMAGE }}:${{ steps.version.outputs.VERSION }} -t ${{ env.WEB_IMAGE }}:sha-${{ github.sha }} --build-arg VITE_API_URL= .

      - name: Push Web image
        run: |
          docker push ${{ env.WEB_IMAGE }}:latest
          docker push ${{ env.WEB_IMAGE }}:${{ steps.version.outputs.VERSION }}
          docker push ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
