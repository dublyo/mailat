name: Build and Push Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; build-and-push adds packages: write for GHCR.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/dublyo/mailat-api
  WEB_IMAGE: ghcr.io/dublyo/mailat-web

# Actions are pinned to full commit SHAs; Dependabot (.github/dependabot.yml)
# proposes the bumps.
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: mailat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAILAT_TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/mailat_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Check API go.mod is tidy
        working-directory: apps/api
        run: go mod tidy -diff
      - name: Vet API
        working-directory: apps/api
        run: go vet ./...
      - name: Check OpenAPI contract
        working-directory: apps/api
        run: go run ./cmd/openapi --check
      - name: Test API
        working-directory: apps/api
        run: go test -race ./...
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Test and build web
        working-directory: apps/web
        # npm run build runs vue-tsc --noEmit before vite build.
        run: |
          npm ci
          npm test
          npm run build
      - name: Check Go SDK go.mod is tidy
        working-directory: packages/sdk-go
        run: go mod tidy -diff
      - name: Vet Go SDK
        working-directory: packages/sdk-go
        run: go vet ./...
      - name: Test Go SDK
        working-directory: packages/sdk-go
        run: go test -race ./...
      - name: Test JavaScript SDK
        working-directory: packages/sdk-js
        run: |
          npm ci
          npm run typecheck
          npm test
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test Python SDK
        working-directory: packages/sdk-python
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: echo "VERSION=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # API: build into the local Docker store, smoke it, then push.
      - name: Build API (local, for smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          load: true
          push: false
          provenance: false
          sbom: false
          build-args: VERSION=${{ github.sha }}
          tags: ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke API image
        run: |
          uid=$(docker run --rm "$API_IMAGE:sha-$GITHUB_SHA" id -u)
          echo "API image runs as uid $uid"
          test "$uid" != "0"

      - name: Push API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: VERSION=${{ github.sha }}
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Web image using standard docker
      - name: Build Web image
        run: |
          cd apps/web
          docker build -t ${{ env.WEB_IMAGE }}:latest -t ${{ env.WEB_IMAGE }}:${{ steps.version.outputs.VERSION }} -t ${{ env.WEB_IMAGE }}:sha-${{ github.sha }} --build-arg VITE_API_URL= .

      - name: Smoke Web image
        # nginx resolves the api upstream at start, so map it to loopback.
        run: |
          docker run -d --name web-smoke --add-host api:127.0.0.1 -p 8080:80 "$WEB_IMAGE:sha-$GITHUB_SHA"
          trap 'docker logs web-smoke; docker rm -f web-smoke >/dev/null' EXIT
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/nginx-health && break
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS http://localhost:8080/nginx-health
          headers=$(curl -fsSI http://localhost:8080/subscribe/x)
          echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy:.*frame-ancestors \*'
          if echo "$headers" | grep -qi '^x-frame-options:'; then
            echo "/subscribe/ must not send X-Frame-Options" >&2
            exit 1
          fi

      - name: Push Web image
        run: |
          docker push ${{ env.WEB_IMAGE }}:latest
          docker push ${{ env.WEB_IMAGE }}:${{ steps.version.outputs.VERSION }}
          docker push ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
