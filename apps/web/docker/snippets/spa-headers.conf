# Security headers for SPA documents and static assets. nginx drops inherited
# add_header directives once a location sets its own, so every SPA location
# includes this file. /api/ and /docs/ never include it: Swagger UI is served by
# the API and needs its CDN and an inline script.
#
# $mailat_csp_base is defined in conf.d/default.conf (rendered from the template
# so MAILAT_CSP_CONNECT_SRC can extend connect-src at container start).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "$mailat_csp_base; frame-ancestors 'self'" always;
