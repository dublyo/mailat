# ===================
# mailat.co - Production Deployment
# ===================
# Deploy with: docker compose -f docker-compose.prod.yml up -d

services:
  # ===================
  # REVERSE PROXY (SSL)
  # ===================
  caddy:
    image: caddy:2-alpine
    container_name: mailat-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - API_DOMAIN=${API_DOMAIN:-api.localhost}
      - MAIL_DOMAIN=${MAIL_DOMAIN:-mail.localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - mailat-network

  # ===================
  # WEB APP (Vue)
  # ===================
  web:
    image: ghcr.io/dublyo/mailat-web:${VERSION:-latest}
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: mailat-web
    restart: unless-stopped
    networks:
      - mailat-network

  # ===================
  # API (Go)
  # ===================
  api:
    image: ghcr.io/dublyo/mailat-api:${VERSION:-latest}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: mailat-api
    restart: unless-stopped
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_URL=${API_URL}
      - WEB_URL=${WEB_URL}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      - APP_DOMAIN=${APP_DOMAIN}
      - APP_NAME=${APP_NAME:-Mailat}
      - WORKER_ENABLED=${WORKER_ENABLED:-true}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - DISABLE_APP_LIMITS=${DISABLE_APP_LIMITS:-true}
      - DEFAULT_MAX_DOMAINS=${DEFAULT_MAX_DOMAINS:-0}
      - DEFAULT_MONTHLY_EMAIL_LIMIT=${DEFAULT_MONTHLY_EMAIL_LIMIT:-0}
      - DEFAULT_MAX_IDENTITIES=${DEFAULT_MAX_IDENTITIES:-0}
      - DEFAULT_MAX_CONTACTS=${DEFAULT_MAX_CONTACTS:-0}
      - STALWART_URL=${STALWART_URL:-http://stalwart:8080}
      - STALWART_ADMIN_TOKEN=${STALWART_ADMIN_TOKEN:-}
      - SMTP_HOST=${SMTP_HOST:-stalwart}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_TLS=${SMTP_TLS:-false}
      - ENV=production
      - NODE_ENV=production
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - SES_CONFIGURATION_SET=${SES_CONFIGURATION_SET:-}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-ses}
    networks:
      - mailat-network

  # ===================
  # OPTIONAL LEGACY MAIL SERVER: --profile stalwart
  # ===================
  stalwart:
    profiles: [stalwart]
    image: stalwartlabs/stalwart:latest
    container_name: mailat-stalwart
    restart: unless-stopped
    ports:
      - "587:587"     # Submission
      - "993:993"     # IMAPS
    environment:
      - STALWART_DATABASE_URL=${STALWART_DATABASE_URL:-}
      - STALWART_ADMIN_TOKEN=${STALWART_ADMIN_TOKEN:-}
    volumes:
      - stalwart_data:/opt/stalwart
      - ./docker/stalwart/config.toml:/opt/stalwart/etc/config.toml:ro
    networks:
      - mailat-network

networks:
  mailat-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  stalwart_data:
